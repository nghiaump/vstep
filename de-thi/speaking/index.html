<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSTEP Speaking – Đề VLU</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--accent:#2f5bea;--accent-soft:#eaf0ff;--ok:#16a34a;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--ink:#e6e9ef;--muted:#98a2b3;--line:#2a303b;--accent:#7c9cff;--accent-soft:#1e2740;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--card);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:17px;margin:0 0 4px}
aside .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.tools{display:flex;gap:6px;margin:10px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:2px}
.list a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:7px;color:inherit;text-decoration:none;font-size:14px}
.list a:hover{background:var(--bg)}
.list a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.list a small{color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
main{padding:28px clamp(16px,4vw,48px);max-width:900px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h2{margin:0;font-size:24px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.card h3{margin:0 0 4px;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.topic{font-weight:600;margin:16px 0 6px}
ol{margin:6px 0 0;padding-left:24px}
ol li{margin:5px 0}
.situation{font-size:17px;margin:10px 0}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.opt b{color:var(--accent);margin-right:6px}
.task{font-style:italic;color:var(--muted)}
.mind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mind .center{grid-column:1/-1;text-align:center;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-weight:700}
.mind .node{border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;text-align:center}
.mind .node.own{border-style:dashed;color:var(--muted)}
.timer{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.clock{font:600 26px/1 ui-monospace,Menlo,monospace;min-width:84px}
.clock.prep{color:var(--warn)}.clock.speak{color:var(--ok)}
.hint{color:var(--muted);font-size:13px}
.src{margin-top:18px;font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.menu{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-105%);transition:.2s;height:100%}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu{display:inline-block}
  main{padding:16px}
  .mind{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>VSTEP Speaking</h1>
    <div class="sub">Đề Văn Lang (VLU) · <span id="count"></span> đề · bản lưu offline</div>
    <input type="search" id="q" placeholder="Tìm chủ đề, từ khoá…">
    <div class="tools"><button id="rand">🎲 Đề ngẫu nhiên</button></div>
    <nav class="list" id="list"></nav>
  </aside>
  <main>
    <div class="head">
      <div style="display:flex;gap:10px;align-items:center"><button class="menu" id="menu">☰</button><h2 id="title"></h2></div>
      <div style="display:flex;gap:6px"><button id="prev">← Đề mới hơn</button><button id="next">Đề cũ hơn →</button></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="card" id="part"></div>
    <div class="src" id="src"></div>
  </main>
</div>
<script>
const DATA = {"135": {"title": "Đề thi VLU 135", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about food\n\n1\nHow often do you eat out?\n2\nDo you prefer eating out or eating at home? Why?\n3\nDo you prefer Vietnamese food or food from other countries? Why?\n\nNow, let’s talk about celebrities\n\n4\nDo you have any idols?\n5\nWhy do you admire this person?\n6\nDo you want to become famous? Why or why not?", "SPEAKING — PART 2\n\nYour brother wants to improve his professional skills and asks for your advice on which course to take.\n\nYou are considering the following options:\n\nOption 1: A management skills course\nOption 2: A presentation skills course\nOption 3: An effective communication skills course\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe uses of social media\n\nUses of Social Media\nEntertainment\nDoing business\nKeeping in touch with others\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think people spend too much time on social media? Why or why not?\n2\nWhat are the disadvantages of using social media?\n3\nIs social media more useful for young people or older people? Why?"], "source": "pdf"}, "134": {"title": "Đề thi VLU 134", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about traveling\n\n1\nWhat do you like most about traveling?\n2\nWhere do you like to stay when you go on holiday?\n3\nWhat activities do you enjoy doing when you travel?\n\nNow, let’s talk about your neighborhood\n\n4\nWhat is your neighborhood like?\n5\nDo you know your neighbors well?\n6\nWould you like to live in the same neighborhood in the future? Why or why not?", "SPEAKING — PART 2\n\nYour school wants to organize an educational activity to teach students about a local pagoda and its cultural value.\n\nYou are considering the following options:\n\nOption 1: A cultural festival\nOption 2: A cultural event\nOption 3: A cultural competition with prizes\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe effects of academic pressure on students\n\nAcademic Pressure\nLack of sleep\nGetting angry easily\nReduced social interaction\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat causes academic pressure among students?\n2\nHow can students deal with academic pressure?\n3\nDo you think schools give students too much homework? Why or why not?"], "source": "pdf"}, "133": {"title": "Đề thi VLU 133", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about places to visit on vacation\n\n1\nWhat kinds of places do you like to visit during your vacation?\n2\nWhy do you like those places?\n3\nWho do you usually go on vacation with?\n\nNow, let’s talk about sports\n\n4\nDo you play any sports?\n5\nDo you prefer playing sports or watching sports? Why?\n6\nWhat is the most popular sport in your country?", "SPEAKING — PART 2\n\nYou are looking for a new job and need to decide where to work.\n\nYou are considering the following options:\n\nOption 1: Working in a big city in your own country\nOption 2: Working abroad\nOption 3: Working in your hometown\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of learning foreign languages\n\nLearning Foreign Languages\nBetter career opportunities\nUnderstanding other cultures\nTraveling and communication\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhich foreign language is the most popular in your country, and why?\n2\nWhat do you think is the best way to learn a foreign language?\n3\nAt what age should children start learning a foreign language?"], "source": "pdf"}, "132": {"title": "Đề thi VLU 132", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about indoor activities\n\n1\nWhat indoor activities do you enjoy doing?\n2\nDo you prefer indoor or outdoor activities? Why?\n3\nWhat do you usually do indoors when the weather is bad?\n\nNow, let’s talk about your work\n\n4\nDo you have a job at the moment? What do you do?\n5\nWhat do you like most about your work?\n6\nWould you like to change your job in the future? Why or why not?", "SPEAKING — PART 2\n\nYour university has funds to build a new sports facility for students and is deciding which one to add.\n\nYou are considering the following options:\n\nOption 1: A gym\nOption 2: A swimming pool\nOption 3: A football field\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of work-life balance\n\nWork-Life Balance\nWhy it is important\nProblems caused by poor balance\nWays to achieve balance\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many people find it difficult to balance work and personal life?\n2\nWhat can companies do to help employees keep a good work-life balance?\n3\nDo you think working from home helps people balance work and personal life? Why or why not?"], "source": "pdf"}, "131": {"title": "Đề thi VLU 131", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about dancing\n\n1\nWhat type of dance do you like the most?\n2\nHave you ever taken any dance lessons? Why or why not?\n3\nDo you think dancing is a good way to stay fit? Why?\n\nNow, let’s talk about taking care of your body\n\n4\nHow do you take care of your body?\n5\nDo you do any exercise regularly? What kind?\n6\nWhat do you think is the most important thing for keeping a healthy body?", "SPEAKING — PART 2\n\nYour friend wants to take her young daughter out this weekend and asks for your advice on where to go.\n\nYou are considering the following options:\n\nOption 1: Going to the zoo\nOption 2: Going to a local park\nOption 3: Going to a children's museum\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of keeping pets\n\nKeeping Pets\nCompanionship\nEmotional support\nHealth benefits\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat kinds of pets do people keep in the place where you live, and why?\n2\nWhat problems can keeping a pet cause for its owner?\n3\nDo you think children should have pets? Why or why not?"], "source": "pdf"}, "130": {"title": "Đề thi VLU 130", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about money\n\n1\nDo you save money?\n2\nWhat is the biggest thing you have ever saved up money to buy?\n3\nDo you think children should be taught the importance of saving money? Why?\n\nNow, let’s talk about healthy habits\n\n4\nDo you often have breakfast?\n5\nWhat kinds of food do you usually eat for breakfast?\n6\nDo you think having breakfast is important for your health? Why?", "SPEAKING — PART 2\n\nYour birthday is coming up and you are deciding how to celebrate it this year.\n\nYou are considering the following options:\n\nOption 1: Celebrating in a crowded place with many people\nOption 2: Having a small party with your family or close friends\nOption 3: Celebrating alone\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nFactors that affect people's choice of jobs\n\nChoosing a Job\nSalary\nWorking environment\nColleagues and boss\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhich factor do young people care about the most when choosing a job?\n2\nWhat is the most popular job in your country?\n3\nDo you think people should choose a job they love or a job with a high salary? Why?"], "source": "pdf"}, "129": {"title": "Đề thi VLU 129", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your health\n\n1\nDo you often get sick?\n2\nHow often do you have health check-ups?\n3\nDo you think people pay enough attention to their health? Why?\n\nNow, let’s talk about saving money\n\n4\nAre you good at saving money?\n5\nWhat do you usually save money for?\n6\nDo you think it is important for young people to learn how to save money? Why?", "SPEAKING — PART 2\n\nYour friend has just graduated as a teacher and is looking for a place to start her career. She asks for your advice on choosing a suitable school.\n\nYou are considering the following options:\n\nOption 1: A big school in a big city\nOption 2: A small school in her hometown\nOption 3: An international school in a big city\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nReasons why misbehavior among young people is increasing\n\nIncreasing Misbehavior\nFamily background\nSchool discipline\nEffects of the Internet\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHow can parents help prevent misbehavior in their children?\n2\nDo you think schools should punish students who misbehave? Why or why not?\n3\nWhat role should the government play in controlling harmful content on the Internet?"], "source": "pdf"}, "128": {"title": "Đề thi VLU 128", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about reading blogs\n\n1\nDo you read blogs? What kinds of blogs do you like?\n2\nHow often do you read blogs, and what device do you use?\n3\nHave you ever thought about writing your own blog? Why or why not?\n\nNow, let’s talk about social media\n\n4\nHow much time do you spend on social media every day?\n5\nWhich social media platform do you use the most? Why?\n6\nDo you think social media has a positive or negative effect on young people? Why?", "SPEAKING — PART 2\n\nYour close friend's birthday is coming up and you want to give her something special.\n\nYou are considering the following options:\n\nOption 1: A handmade card\nOption 2: A photo of the two of you together\nOption 3: Taking her out for dinner at a restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nSolutions to reduce obesity\n\nReducing Obesity\nEating less fast food\nCooking meals at home\nDoing more exercise\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy is obesity becoming more common nowadays?\n2\nWho should be more responsible for fighting obesity, individuals or the government?\n3\nDo you think a tax on fast food and sugary drinks would help reduce obesity? Why or why not?"], "source": "pdf"}, "127": {"title": "Đề thi VLU 127", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your hobbies\n\n1\nWhat are your hobbies?\n2\nDo you prefer hobbies that you do alone or with other people? Why?\n3\nHave your hobbies changed since you were a child? How?\n\nNow, let’s talk about traveling\n\n4\nDo you like traveling? Why or why not?\n5\nWhere would you like to travel next?\n6\nDo you prefer traveling alone or with other people? Why?", "SPEAKING — PART 2\n\nYour city is planning to introduce fines for some types of inappropriate behavior in public, and you need to decide which behavior should be punished most strictly.\n\nYou are considering the following options:\n\nOption 1: Using a mobile phone while driving\nOption 2: Talking loudly in public places\nOption 3: Smoking in restaurants\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of face-to-face communication\n\nFace-to-Face Communication\nBuilding trust and relationships\nUnderstanding body language and emotions\nAvoiding misunderstandings\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think people communicate face to face less than in the past? Why?\n2\nWhat are the disadvantages of online communication?\n3\nIn which situations is face-to-face communication better than online communication?"], "source": "pdf"}, "126": {"title": "Đề thi VLU 126", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your reading habits\n\n1\nHow often do you read books?\n2\nWhat kinds of books do you like to read?\n3\nWhere and when do you usually read?\n\nNow, let’s talk about living in the city or the countryside\n\n4\nDo you prefer living in the city or in the countryside? Why?\n5\nWhat do you like most about the place where you live?\n6\nWould you like to live in a different place in the future? Why or why not?", "SPEAKING — PART 2\n\nYour friend is a teacher and is going to organize a Year End Party for her young students. She asks you for advice on which activity to choose.\n\nYou are considering the following options:\n\nOption 1: A cooking workshop\nOption 2: A music and fashion show\nOption 3: Minigames for the children\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe reasons why young people lose their jobs\n\nYoung People Losing Jobs\nBad attitude\nLack of skills\nUnrealistic salary expectations\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHow can young people avoid losing their jobs?\n2\nDo you think schools prepare students well enough for the workplace? Why or why not?\n3\nWhat can employers do to help young employees improve their performance?"], "source": "pdf"}, "125": {"title": "Đề thi VLU 125", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about landscapes\n\n1\nWhat kind of scenery do you like the most?\n2\nWhat does the scenery around your home look like?\n3\nDo you like taking photos of landscapes? Why or why not?\n\nNow, let’s talk about drawing\n\n4\nDo you like drawing? Why or why not?\n5\nWhat do you usually draw when you have free time?\n6\nDo you think drawing is a useful skill for children? Why?", "SPEAKING — PART 2\n\nYou have just graduated and received three job offers. You are deciding which type of company to work for.\n\nYou are considering the following options:\n\nOption 1: A foreign company\nOption 2: A family-owned company\nOption 3: A start-up company\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe advantages of electric vehicles\n\nElectric Vehicles\nProtecting the environment\nLower running costs\nGaining better driving experience\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think electric vehicles are better than gasoline vehicles? Why?\n2\nWhat are the disadvantages of electric vehicles?\n3\nWhat can governments do to encourage people to buy electric vehicles?"], "source": "pdf"}, "124": {"title": "Đề thi VLU 124", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about shopping\n\n1\nHow often do you go shopping?\n2\nWhere do you usually go shopping, and who do you go with?\n3\nDo you prefer buying things in stores or online? Why?\n\nNow, let’s talk about weekends\n\n4\nWhat do you usually do at weekends?\n5\nDo you prefer spending weekends at home or going out? Why?\n6\nWhat would your ideal weekend be like?", "SPEAKING — PART 2\n\nYou have a two-week summer holiday and you are deciding how to spend it.\n\nYou are considering the following options:\n\nOption 1: Going backpacking on your own or with friends\nOption 2: Joining a package tour\nOption 3: Staying at home\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nUsing mobile phones at school\n\nMobile Phones at School\nBenefits for learning\nDistractions in class\nSafety and communication\n[your own ideas]\n\nFollow-up Questions:\n\n1\nShould schools allow students to use mobile phones in class? Why or why not?\n2\nHow can teachers help students use their phones responsibly?\n3\nAt what age do you think children should have their own mobile phones?"], "source": "pdf"}, "123": {"title": "Đề thi VLU 123", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about AI tools\n\n1\nDo you use AI tools in your daily life? What do you use them for?\n2\nDo you think AI is helpful for students? Why?\n3\nWhat are the possible risks of relying too much on AI?\n\nNow, let’s talk about reading books\n\n4\nDo you enjoy reading books? What kinds of books do you like?\n5\nWhen and where do you usually read?\n6\nDo you prefer paper books or e-books? Why?", "SPEAKING — PART 2\n\nYou and your friends want to have dinner together at a restaurant this weekend and you need to decide where to go.\n\nYou are considering the following options:\n\nOption 1: A Thai restaurant\nOption 2: A Chinese restaurant\nOption 3: A Japanese restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe causes of obesity in children\n\nChildhood Obesity\nUnhealthy eating habits\nLack of physical activity\nToo much screen time\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWho should be responsible for preventing obesity in children, parents or schools?\n2\nWhat can parents do to help their children eat more healthily?\n3\nDo you think advertisements for fast food should be restricted for children?"], "source": "pdf"}, "122": {"title": "Đề thi VLU 122", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about sports\n\n1\nDo you often play or watch sports?\n2\nWhat is your favorite sport and why?\n3\nDo you think sports are important for a person's health?\n\nNow, let’s talk about TV programs\n\n4\nDo you often watch TV programs?\n5\nWhat type of TV program do you enjoy watching the most?\n6\nDo you prefer watching TV alone or with your family?", "SPEAKING — PART 2\n\nYour class is organizing a potluck party and needs to choose one dish for the whole class to prepare together.\n\nYou are considering the following options:\n\nOption 1: Fried spring rolls\nOption 2: Fried rice\nOption 3: Beef noodles\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of traveling in a group\n\nBenefits of Group Traveling\nSharing costs and reducing travel expenses\nFeeling safer and more supported during the trip\nCreating shared memories and stronger friendships\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat do you think are the main advantages of traveling with a group rather than alone?\n2\nAre there any disadvantages to traveling in a group?\n3\nWould you say group traveling is more suitable for young people or for families? Why?"]}, "121": {"title": "Đề thi VLU 121", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about eating out\n\n1\nDo you often eat out?\n2\nDo you usually eat alone or with other people? Why?\n3\nWhat type of restaurant do you prefer when eating out?\n\nNow, let’s talk about seasons and weather\n\n4\nWhich season do you like most in your country?\n5\nHas your country ever experienced unusual or extreme weather changes?\n6\nHow does the weather usually affect your daily activities or mood?", "SPEAKING — PART 2\n\nYour family is planning a party to celebrate an important occasion.\n\nYou are considering the following options:\n\nOption 1: Hold the party at a resort\nOption 2: Hold the party at a family member's house\nOption 3: Hold the party at a restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of traveling\n\nBenefits of Traveling\nExperiencing new cultures\nLearning new skills\nGaining more life experience\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat is the most memorable trip you have ever taken?\n2\nIf you travel, would you rather go with friends or your family? Why?\n3\nWhen you travel, would you choose a luxury tour or a standard tour?"]}, "120": {"title": "Đề thi VLU 120", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your daily routine\n\n1\nWhat do you usually do in a typical day?\n2\nWhich part of your day do you enjoy the most, and why?\n3\nDo you think it's important to have a fixed daily routine? Why or why not?\n\nNow, let’s talk about meals\n\n4\nWhich meal of the day do you think is the most important?\n5\nWhat kind of dishes do you usually eat for that meal?\n6\nDo you think eating healthily is important? Why?", "SPEAKING — PART 2\n\nYou and a close friend are planning to have dinner together to celebrate finishing your final exams.\n\nYou are considering the following options:\n\nOption 1: Have dinner at a Thai restaurant\nOption 2: Have dinner at a Japanese restaurant\nOption 3: Have dinner at a Chinese restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nFactors contributing to childhood obesity in modern society\n\nChildhood Obesity\nUnhealthy eating habits\nLack of physical activity and screen time\nFamily and social environment\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat can parents do to help prevent obesity in their children?\n2\nDo you think schools should play a bigger role in promoting healthy eating among students?\n3\nHow does childhood obesity affect a person's health later in life?"]}, "119": {"title": "Đề thi VLU 119", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your family\n\n1\nHow many people are there in your family?\n2\nWhat does your family usually do together on weekends?\n3\nWho is the main decision-maker in your family?\n\nNow, let’s talk about outdoor activities\n\n4\nDo you often take part in outdoor activities?\n5\nWhat is your favorite outdoor activity?\n6\nDo you usually do outdoor activities alone or with others?", "SPEAKING — PART 2\n\nYour friend has just received three job offers and is asking for your advice on which one to choose.\n\nYou are considering the following options:\n\nOption 1: A job with a high salary but long working hours\nOption 2: A job with good opportunities for career growth and training\nOption 3: A job with a flexible working schedule but a lower salary\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe trend of eating out among young people today\n\nEating Out Among Young People\nPopularity of eating out among young people today\nReasons why young people prefer eating out\nCriteria for choosing a good restaurant\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo young people nowadays eat out often?\n2\nWhy do many young people enjoy eating out rather than cooking at home?\n3\nWhat should people consider when choosing a place to eat?"]}, "118": {"title": "Đề thi VLU 118", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about healthy eating\n\n1\nDo you enjoy eating healthy food? Why or why not?\n2\nWould you like to follow a Mediterranean diet? Why or why not?\n3\nWhat dishes would you like to share if your friends came over to your place?\n\nNow, let’s talk about parks\n\n4\nWhat is your favorite park and why do you like it?\n5\nHow often do you go to that park?\n6\nWhat do you like most about spending time in parks in general?", "SPEAKING — PART 2\n\nYour friend has an important presentation coming up and wants to practice speaking beforehand.\n\nYou are considering the following options:\n\nOption 1: Practice standing in front of a mirror\nOption 2: Record herself and listen back to the recording\nOption 3: Practice speaking in front of a small group of friends\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe impact of technology on learning\n\nTechnology and Learning\nOver-reliance on technology\nReduced critical thinking\nInformation overload\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think technology will completely replace traditional teaching methods?\n2\nHow can people avoid becoming too dependent on technology?\n3\nWhat skills do students need to use technology effectively for learning?"]}, "117": {"title": "Đề thi VLU 117", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your family responsibilities\n\n1\nWhat do you think are your main responsibilities towards your family?\n2\nHow do you usually help your family members in daily life?\n3\nDo you think responsibilities towards family change as people grow older? Why?\n\nNow, let’s talk about making money\n\n4\nWhy do you think making money is important?\n5\nWhat are some ways young people today try to earn money?\n6\nDo you think money can bring happiness? Why or why not?", "SPEAKING — PART 2\n\nYou have just graduated and received three different job offers.\n\nYou are considering the following options:\n\nOption 1: A job with a high salary\nOption 2: A job with a good working environment\nOption 3: A job that you are truly passionate about\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of failure in personal growth\n\nBenefits of Failure\nLearning valuable lessons from mistakes\nBuilding resilience and character\nMotivation for future success\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think schools should teach students how to handle failure?\n2\nHow can people stay motivated after experiencing failure?\n3\nIs failure always a bad thing? Why or why not?"]}, "116": {"title": "Đề thi VLU 116", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about learning English in high school\n\n1\nDid you enjoy learning English in high school?\n2\nWhat was the most difficult part of learning English at school?\n3\nHow do you think high schools can improve the way they teach English?\n\nNow, let’s talk about traditional food\n\n4\nWhat is your favorite traditional dish?\n5\nHow is this dish usually prepared?\n6\nDo you think traditional dishes are still popular among young people today?", "SPEAKING — PART 2\n\nYou and your friends are deciding where to eat dinner tonight.\n\nYou are considering the following options:\n\nOption 1: Cook a meal at home\nOption 2: Eat at a fast food restaurant\nOption 3: Eat at a local restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe disadvantages of doing exercise\n\nDisadvantages of Exercise\nWasting time\nWasting money\nRisk of getting injuries\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHow can people avoid getting injured while exercising?\n2\nDo you think the benefits of exercise outweigh the disadvantages?\n3\nWhat advice would you give to someone who is too busy to exercise?"]}, "115": {"title": "Đề thi VLU 115", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about sports\n\n1\nWhat sport do you usually play?\n2\nIs there a sport you would like to try in the future?\n3\nDo you often watch sports programs on TV?\n\nNow, let’s talk about food\n\n4\nWhat is your favorite food?\n5\nDo you often cook at home?\n6\nDo you often eat out at restaurants?", "SPEAKING — PART 2\n\nYour class is going on a field trip to Hanoi and needs to decide what food to try together.\n\nYou are considering the following options:\n\nOption 1: Beef noodle soup (Pho Bo)\nOption 2: Fried rice\nOption 3: Grilled meat (T , let’s talk about family activities\n\n4\nWhat do you usually do with your family in your free time?\n5\nHow often do you spend time together as a family?\n6\nDo you think family activities have changed compared to the past?", "SPEAKING — PART 2\n\nYour friend has just graduated from university and is trying to decide what to do next.\n\nYou are considering the following options:\n\nOption 1: Continue studying for a higher degree\nOption 2: Look for a job immediately\nOption 3: Do volunteer work for a while\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe qualities that a good teacher should have\n\nQualities of a Good Teacher\nCreativity in teaching methods\nPatience with students\nExtensive knowledge of the subject\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhich quality do you think is the most important for a teacher?\n2\nHow does a teacher's creativity affect students' learning?\n3\nDo you think teachers today need different qualities compared to the past?"]}, "112": {"title": "Đề thi VLU 112", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your weekends\n\n1\nWhat do you usually do on weekends?\n2\nDo you prefer spending your weekends at home or going out?\n3\nWho do you usually spend your weekends with?\n\nNow, let’s talk about celebrities\n\n4\nDo you have a favorite celebrity?\n5\nWhy do you admire this celebrity?\n6\nDo you think celebrities have a big influence on young people today?", "SPEAKING — PART 2\n\nYour school is organizing a special holiday celebration and students need to decide what to wear for the event.\n\nYou are considering the following options:\n\nOption 1: Wear the traditional school uniform\nOption 2: Wear traditional costumes (Ao Dai for girls, formal traditional wear for boys)\nOption 3: Wear casual clothes of their own choice\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of protecting the environment\n\nBenefits of Environmental Protectio ow does stress affect a person's overall health?\n3\nDo you think young people today pay enough attention to their health?"]}, "108": {"title": "Đề thi VLU 108", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about online courses\n\n1\nHave you ever taken an online course before?\n2\nWhat do you like most about learning online?\n3\nWhat difficulties do you face when studying online?\n\nNow, let’s talk about public transportation\n\n4\nHow often do you use public transportation?\n5\nWhat are the advantages of using public transportation?\n6\nDo you think more people should use public transportation instead of private vehicles?", "SPEAKING — PART 2\n\nYou and a friend are planning a farewell gift for a colleague who is leaving the company.\n\nYou are considering the following options:\n\nOption 1: A framed photo of the two of you together\nOption 2: A handmade gift\nOption 3: A dinner party at a restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nEffective solutions to reduce obesity in modern society\n\nSolutions to Reduce Obesity\nEating less fast food\nExercising regularly\nCooking meals at home\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat types of fast food are popular in your country?\n2\nWhy do many people choose to eat fast food?\n3\nApart from obesity, what other health problems can fast food cause?"]}, "107": {"title": "Đề thi VLU 107", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about email\n\n1\nDo you often use email? How frequently?\n2\nWhy do you think people use email instead of other communication methods?\n3\nWhat are the main benefits of using email?\n\nNow, let’s talk about where you study or work\n\n4\nWhere do you usually study or work?\n5\nWhat do you do to work or study more effectively?\n6\nDo you think your environment affects your productivity?", "SPEAKING — PART 2\n\nA company is planning its annual team-building event and needs to choose a location.\n\nYou are considering the following options:\n\nOption 1: A theme park\nOption 2: A riverbank area\nOption 3: A rural campsite\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of training programs for employees\n\nBenefits of Training Programs\nImproving job performance and skills\nBoosting employee confidence and motivation\nIncreasing company productivity and growth\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat factors make a training session successful?\n2\nWhat types of workshops are popular among people in your area?\n3\nDo you think all companies should invest in employee training?"]}, "106": {"title": "Đề thi VLU 106", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your school\n\n1\nWhat type of school did you attend when you were young?\n2\nDo you prefer public schools or private schools? Why?\n3\nWhat do you think are the main differences between public and private schools?\n\nNow, let’s talk about traffic jams\n\n4\nDo you often experience traffic jams where you live?\n5\nWhen do traffic jams usually happen in your city?\n6\nWhat do you think can be done to reduce traffic congestion?", "SPEAKING — PART 2\n\nYour city wants to attract more tourists.\n\nYou are considering the following options:\n\nOption 1: Advertise through TV and radio\nOption 2: Write engaging content such as travel blogs and articles\nOption 3: Promote the city through social media\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nEffective ways to reduce crime rates in society\n\nWays to Reduce Crime Rates\nInstalling security cameras in public areas\nBuilding more prisons and stricter punishment\nImproving education and awareness\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHave you ever encountered a crime yourself?\n2\nWhat types of crime are common in your country?\n3\nDo you think your country is safe?"]}, "105": {"title": "Đề thi VLU 105", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your hobbies ucing feelings of loneliness\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat is the most common pet in your area, and why do you think that is?\n2\nShould parents encourage their kids to keep a pet?\n3\nWhy do you think many people choose not to keep pets?"]}, "100": {"title": "Đề thi VLU 100", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about shopping\n\n1\nDo you enjoy shopping?\n2\nDo you prefer shopping online or at physical stores? Why?\n3\nHow often do you go shopping, and what do you usually buy?\n\nNow, let’s talk about your family\n\n4\nDo you often spend time with your family?\n5\nWhat activities do you usually do together with your family?\n6\nDo you think family plays an important role in a person's life? Why?", "SPEAKING — PART 2\n\nYou want to buy a graduation gift for your best friend, but you can only afford one item.\n\nYou are considering the following options:\n\nOption 1: A wristwatch\nOption 2: A pair of headphones\nOption 3: A framed photograph of your friendship\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of teamwork skills for students\n\nTeamwork Skills\nThe role of a leader in guiding a team\nHow sharing and combining ideas leads to better results\nBenefits teamwork brings to studying and future careers\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat qualities make a good team leader?\n2\nDo you think working in a team is always better than working alone? Why?\n3\nHow can students improve their teamwork skills?"]}, "99": {"title": "Đề thi VLU 99", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about the weather\n\n1\nWhat is the weather usually like in your hometown?\n2\nWhat is your favorite season of the year? Why?\n3\nDoes bad weather ever affect your daily activities? How?\n\nNow, let’s talk about your hobbies\n\n4\nWhat do you like to do in your free time?\n5\nHow did you discover this hobby?\n6\nDo you think hobbies are important for a person's life? Why?" rce in Modern Society\nCommon causes such as financial difficulties and lack of communication\nEffects on children's psychological development\nEffects on the individuals involved, both emotionally and financially\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think divorce rates are increasing in modern society? Why?\n2\nHow can couples reduce the risk of divorce?\n3\nShould parents stay together for the sake of their children, even in an unhappy marriage?"], "source": "pdf"}, "83": {"title": "Đề thi VLU 83", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about birthdays\n\n1\nHow do you usually celebrate your birthday?\n2\nWho do you usually spend your birthday with?\n3\nDo you prefer having a big party or a quiet celebration for your birthday? Why?\n\nNow, let’s talk about shopping\n\n4\nHow often do you go shopping?\n5\nWhat do you usually buy when you go shopping?\n6\nDo you prefer shopping online or shopping at physical stores? Why?", "SPEAKING — PART 2\n\nA group of students from Australia is visiting your school for a cultural exchange program.\n\nYou are considering the following options:\n\nOption 1: Organise an English talkshow\nOption 2: Organise a sports competition\nOption 3: Organise a music show\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe ways students learn history\n\nLearning History\nLearning through textbooks and traditional lectures\nLearning through visual media such as documentaries and films\nLearning through visiting historical sites and museums\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do some students find history boring to learn?\n2\nHow can teachers make history lessons more interesting?\n3\nDo you think learning history is important for young people today?"], "source": "pdf"}, "82": {"title": "Đề thi VLU 82", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about school activities\n\n1\nWhat kinds of activities does your school organize for students?\n2\nWhich school activity do you enjoy the most?\n3\nDo you think extracurricular activities are important for students? Why?\n\nNow, let’s talk about entertainment\n\n4\nWhat do you usually do for entertainment in your free time?\n5\nDo you prefer watching movies or listening to music to relax?\n6\nHow has your way of entertaining yourself changed compared to the past?", "SPEAKING — PART 2\n\nSomeone has accidentally transferred a large amount of money into your bank account.\n\nYou are considering the following options:\n\nOption 1: Stay silent and keep the money\nOption 2: Inform the bank about the mistake\nOption 3: Report the incident to the police\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of having a holiday at home\n\nHoliday at Home\nIt is inexpensive since there is no need for transportation or accommodation\nIt is safe compared to traveling far away\nIt is relaxing without the stress of planning a trip\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think staying at home during a holiday can get boring after a while?\n2\nWhat activities can people do at home to make their holiday more enjoyable?\n3\nDo you prefer traveling or staying at home for a holiday? Why?"], "source": "pdf"}, "81": {"title": "Đề thi VLU 81", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about the Internet\n\n1\nHow often do you use the internet?\n2\nWhat do you usually use the internet for?\n3\nDo you think the internet has more advantages or disadvantages for students?\n\nNow, let’s talk about saving money\n\n4\nDo you usually save money?\n5\nWhat do you usually save money for?\n6\nDo you think it's important for young people to learn how to save money?", "SPEAKING — PART 2\n\nYou are planning to get a pet for your home.\n\nYou are considering the following options:\n\nOption 1: A dog\nOption 2: A cat\nOption 3: A fish\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe advantages of electric cars\n\nAdvantages of Electric Cars\nReducing air pollution and protecting the environment\nLowering fuel and maintenance costs\nPromoting the use of advanced technology\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think electric cars will completely replace petrol cars in the future?\n2\nWhat are the main obstacles preventing people from buying electric cars?\n3\nShould the government offer more support to encourage people to use electric cars?"], "source": "pdf"}, "80": {"title": "Đề thi VLU 80", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your family responsibilities\n\n1\nWho is the main breadwinner in your family?\n2\nDo you share any responsibilities with other family members? What are they?\n3\nHow can responsibilities be divided fairly among family members?\n\nNow, let’s talk about money and happiness\n\n4\nWhat do you usually spend your money on?\n5\nDo you think having more money makes you happier?\n6\nWhat do you think matters more for happiness: money or relationships?", "SPEAKING — PART 2\n\nYour cousin has just graduated and is looking for advice on which job to choose.\n\nYou are considering the following options:\n\nOption 1: A job with a high salary\nOption 2: A job that matches their interest\nOption 3: A job with a friendly working environment\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of failure\n\nBenefits of Failure\nTeaches valuable and memorable lessons\nMotivates people to work harder\nImproves problem-solving skills\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think people learn more from failure than from success? Why?\n2\nHow should parents react when their children fail at something?\n3\nCan too much failure discourage a person instead of motivating them?"], "source": "pdf"}, "79": {"title": "Đề thi VLU 79", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your house\n\n1\nHow many rooms are there in your house?\n2\nWhich room in your house do you like your own ideas]\n\nFollow-up Questions:\n\n1\nWhat factors would you consider when hiring a housemaid?\n2\nNowadays, do both men and women work as housemaids? Why or why not?\n3\nIf you were unemployed, would you choose to work as a housemaid? Why or why not?"], "source": "pdf"}, "77": {"title": "Đề thi VLU 77", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about traveling\n\n1\nHave you ever traveled to a place that left a strong impression on you?\n2\nWhat did you enjoy most about that trip?\n3\nDo you prefer traveling alone or with other people? Why?\n\nNow, let’s talk about sports\n\n4\nDo you play any sports regularly?\n5\nWhy do you think sport is important for people's health?\n6\nHas your interest in sport changed compared to when you were younger?", "SPEAKING — PART 2\n\nYou have just graduated and need to decide where to start your career.\n\nYou are considering the following options:\n\nOption 1: Work in your hometown\nOption 2: Work in a big city\nOption 3: Work in a foreign country\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of learning a new language\n\nLearning a New Language\nMaking new friends\nLearning about the culture\nCommunicating while traveling\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDoes learning a language at a young age affect children in any way?\n2\nWhy do some people learn languages faster than others?\n3\nIs grammar important when learning a language?"], "source": "pdf"}, "76": {"title": "Đề thi VLU 76", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about saving money\n\n1\nDo you usually save money? Why or why not?\n2\nWhat do you usually save money for?\n3\nDo you think saving money is important? Why?\n\nNow, let’s talk about your weekends\n\n4\nHow do you usually spend your weekends?\n5\nDo you prefer staying at home or going out at the weekend? Why?\n6\nWhat activities help you relax after a busy week?", "SPEAKING — PART 2\n\nYour school is planning a graduation ceremony for students.\n\nYou are considering the following options:\n\nOption 1: Hold the ceremony at the school\nOption 2: Hold the ceremony in a large city\nOption 3: Hold the ceremony in a large convention hall\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of good behavior\n\nGood Behavior\nBuilding positive relationships with others\nCreating a better school and working environment\nHelping people succeed in life and work\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy is good behavior important in society?\n2\nWhat factors influence people's behavior?\n3\nCan schools help students develop good behavior? How?"], "source": "pdf"}, "75": {"title": "Đề thi VLU 75", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about travel plans\n\n1\nWhere are you planning to travel next year?\n2\nWhat is your favourite place to travel to? Why?\n3\nHow do you usually plan your trips?\n\nNow, let’s talk about recycling\n\n4\nWhat things do you usually recycle?\n5\nDo people around you often recycle? Why or why not?\n6\nDo you think recycling is important? Why?", "SPEAKING — PART 2\n\nYour friend wants to choose a new job. He enjoys staying healthy and also likes helping other people.\n\nYou are considering the following options:\n\nOption 1: Become a fitness trainer\nOption 2: Become a nutritionist\nOption 3: Work as a healthcare worker\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe Benefits of Extracurricular Activities for Children\n\nExtracurricular Activities\nDeveloping social connections\nImproving physical and mental health\nLearning important life skills\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think schools should require all children to join extracurricular activities? Why or why not?\n2\nHow can parents encourage their children to participate in extracurricular activities?\n3\nWhich extracurricular activity is the most beneficial for children? Why?"], "source": "pdf"}, "74": {"title": "Đề thi VLU 74", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about going out\n\n1\nDo you often go out in your free time? Why or why not?\n2\nDo you prefer going out alone or with other people? Why?\n3\nHave you visited any places in your country? Why did you choose those places?\n\nNow, let’s talk about studying\n\n4\nWhat do you usually do when you study?\n5\nDo you prefer studying alone or studying with others? Why?\n6\nWhat difficulties do you often face when studying?", "SPEAKING — PART 2\n\nYou are planning a trip to a mountain area and need to choose the best place to stay.\n\nYou are considering the following options:\n\nOption 1: Stay outdoors and go camping\nOption 2: Stay at a hotel\nOption 3: Stay at a homestay\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of reading e-books\n\nBenefits Of E-books\nSaving time and providing convenient access to books\nReducing cost and protecting the environment\nSupporting flexible learning and reading habits\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are the disadvantages of reading e-books?\n2\nDo you think e-books will replace paper books in the future? Why or why not?\n3\nAre e-books popular in your country? Why?"], "source": "pdf"}, "73": {"title": "Đề thi VLU 73", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about traveling\n\n1\nDo you like traveling? Why or why not?\n2\nWhat is the most memorable trip you have ever had?\n3\nDo you usually keep memories from your trips? How?\n\nNow, let’s talk about memories\n\n4\nWhy do people like traveling to different places?\n5\nDo you think memories are important in life? Why or why not?\n6\nWhat is a special memory that you still remember clearly?", "SPEAKING — PART 2\n\nYour school is organizing a geography project to help students learn more about different places and cultures.\n\nYou are considering the following options:\n\nOption 1: A project about famous architecture around the world\nOption 2: A project about local music and traditional culture\nOption 3: A project about environmental issues in different regions\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe role of technology in the workplace\n\nTechnology In Workplace\nImproving productivity and work efficiency\nSupporting communication and teamwork\nCreating new ways of working and career opportunities\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHow has technology changed the way people work?\n2\nWhat are the disadvantages of using technology at work?\n3\nWill technology replace human workers in the future?"], "source": "pdf"}, "72": {"title": "Đề thi VLU 72", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about AI tools\n\n1\nDo you often use AI tools in your daily life?\n2\nWhat do you usually use AI tools for?\n3\nWhat are the advantages and disadvantages of using AI tools?\n\nNow, let’s talk about languages\n\n4\nWhat languages can you speak?\n5\nWhy do you think learning a foreign language is important?\n6\nWhat do you usually do to improve your language skills?", "SPEAKING — PART 2\n\nYour university wants to organize a festival to welcome new students at the beginning of the academic year.\n\nYou are considering the following options:\n\nOption 1: Organize a music and performance festival\nOption 2: Organize a food and cultural exchange festival\nOption 3: Organize a sports and outdoor activity festival\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nFactors to consider when choosing a job\n\nChoosing a Job\nSalary and financial benefits\nWorking environment and company culture\nCareer development opportunities\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do young people have different expectations when choosing jobs today?\n2\nDo you think salary is more important than job satisfaction? Why?\n3\nWhat can companies do to attract young employees?"], "source": "pdf"}, "71": {"title": "Đ ful.\n\nYou are considering the following options:\n\nOption 1: Read books in a library\nOption 2: Explore information and places through the Internet\nOption 3: Meet and talk with friends to learn more about local life\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of becoming a young leader\n\nYoung Leadership\nQualities of a good young leader\nBenefits of young leadership in society\nWays to develop leadership skills\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy are leadership skills important for young people?\n2\nCan everyone become a good leader? Why or why not?\n3\nHow can young people develop leadership skills?"], "source": "pdf"}, "58": {"title": "Đề thi VLU 58", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about pets\n\n1\nDo you have any pets at home?\n2\nWhy do you think many people like keeping pets?\n3\nWhat are the advantages and disadvantages of having a pet?\n\nNow, let’s talk about your health\n\n4\nHow do you usually take care of your health?\n5\nWhat habits can help people stay healthy?\n6\nHave your health habits changed compared to the past? Why?", "SPEAKING — PART 2\n\nYou want to choose a meaningful gift for your friend's birthday.\n\nYou are considering the following options:\n\nOption 1: Buy a book\nOption 2: Buy a movie ticket\nOption 3: Make a handmade gift\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nWays to stay healthy\n\nStaying Healthy\nMaintaining a balanced diet\nDoing regular exercise and physical activities\nTaking care of mental health and reducing stress\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many people find it difficult to maintain a healthy lifestyle?\n2\nWhat role does technology play in helping people stay healthy?\n3\nShould schools teach students more about health? Why?"], "source": "pdf"}, "57": {"title": "Đề thi VLU 57", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about cooking\n\n1\nDo you often co \nFollow-up Questions:\n\n1\nWhy do some people prefer staying at home during holidays?\n2\nDo you think stay-at-home holidays will become more popular in the future?\n3\nWhat are the disadvantages of spending holidays at home?"], "source": "pdf"}, "52": {"title": "Đề thi VLU 52", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your free time\n\n1\nWhat do you usually do in your free time?\n2\nWhat do you do to manage your time effectively?\n3\nWhich time of the day do you like the most? Why?\n\nNow, let’s talk about entertainment\n\n4\nWhat do you usually do for entertainment?\n5\nWhat kind of entertainment do you enjoy the most? Why?\n6\nDo you think entertainment is important in people's lives? Why or why not?", "SPEAKING — PART 2\n\nYour friend has been feeling stressed recently and wants to improve his or her mental well-being.\n\nYou are considering the following options:\n\nOption 1: Learn a new skill\nOption 2: Try a new sport\nOption 3: Take part in volunteer activities\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nBenefits of Owning a Personal Car\n\nPersonal Cars\nConvenient for long-distance travel\nProtection from bad weather\nGreater comfort and flexibility\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHow has the number of cars increased in Vietnam during the 20th and 21st centuries?\n2\nDo you think the number of cars will continue to increase in the future? Will people still use them?\n3\nHow do personal cars affect people's lives?"], "source": "pdf"}, "51": {"title": "Đề thi VLU 51", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about traveling\n\n1\nDo you prefer traveling alone or with your family? Why?\n2\nWhat is the most memorable place you have ever visited?\n3\nWhy was that place memorable to you?\n\nNow, let’s talk about social media\n\n4\nHow often do you use social media in your daily life?\n5\nWhat do you usually use social media for?\n6\nDo you think social media has changed the ouples maintain a healthy and lasting relationship?"], "source": "pdf"}};
const ids = Object.keys(DATA).map(Number).sort((a,b)=>b-a);
const TIME = {1:{prep:0,speak:180},2:{prep:60,speak:180},3:{prep:60,speak:240}};
let cur = ids[0], part = 1, tick = null;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function lines(t){ return t.split('\n').slice(1).map(s=>s.trim()).filter(Boolean); }
function questions(arr){ const q=[]; for(let i=0;i<arr.length;i++){ if(/^\d+$/.test(arr[i]) && arr[i+1]){ q.push(arr[i+1]); i++; } } return q; }

function renderP1(t){
  const L = lines(t).filter(s=>s!=='Questions:'); let html='', buf=[];
  const flush=()=>{ if(buf.length){ html+='<ol>'+questions(buf).map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>'; buf=[]; } };
  let n=0;
  for(const s of L){ if(/^(Now, )?let.s talk about/i.test(s)){ flush(); html+='<div class="topic">'+esc(s)+'</div>'; } else buf.push(s); }
  flush();
  // keep original numbering across the two topics
  return html.replace(/<ol>/g, () => { const start = n*3+1; n++; return '<ol start="'+start+'">'; });
}
function renderP2(t){
  const L = lines(t); const opts=L.filter(s=>/^Option \d+:/.test(s));
  const sit = L[0]; const task = L.find(s=>/^Choose/.test(s))||'';
  return '<p class="situation">'+esc(sit)+'</p><div class="opts">'+opts.map(o=>{const m=o.match(/^(Option \d+):\s*(.*)$/);return '<div class="opt"><b>'+m[1]+'</b>'+esc(m[2])+'</div>';}).join('')+'</div><p class="task">'+esc(task)+'</p>';
}
function renderP3(t){
  const L = lines(t); const fi = L.indexOf('Follow-up Questions:');
  const topic = L[0], mind = L.slice(1, fi<0?L.length:fi), fq = fi<0?[]:questions(L.slice(fi+1));
  const [center, ...nodes] = mind;
  return '<div class="topic" style="font-size:18px">'+esc(topic)+'</div>'
    + '<div class="mind"><div class="center">'+esc(center||'')+'</div>'+nodes.map(n=>'<div class="node'+(/your own/i.test(n)?' own':'')+'">'+esc(n)+'</div>').join('')+'</div>'
    + (fq.length?'<div class="topic">Follow-up questions</div><ol>'+fq.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>':'');
}
const R = {1:renderP1,2:renderP2,3:renderP3};
const NAME = {1:'Part 1 · Social interaction',2:'Part 2 · Solution discussion',3:'Part 3 · Topic development'};

function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function stopTimer(){ clearInterval(tick); tick=null; }
function startTimer(){
  stopTimer(); const T=TIME[part]; let phase=T.prep?'prep':'speak', left=T.prep||T.speak;
  const c=$('#clock'), lab=$('#phase');
  const draw=()=>{ c.textContent=fmt(left); c.className='clock '+phase; lab.textContent=phase==='prep'?'Chuẩn bị':'Đang nói'; };
  draw();
  tick=setInterval(()=>{ left--; if(left<0){ if(phase==='prep'){ phase='speak'; left=T.speak; } else { stopTimer(); c.textContent='Hết giờ'; lab.textContent=''; return; } } draw(); },1000);
}

function show(){
  stopTimer();
  const ex = DATA[cur];
  $('#title').textContent = ex.title;
  $('#tabs').innerHTML = [1,2,3].map(n=>'<button class="'+(n===part?'on':'')+'" data-p="'+n+'">Part '+n+'</button>').join('');
  const T=TIME[part];
  $('#part').innerHTML = '<h3>'+NAME[part]+'</h3>'+R[part](ex.parts[part-1])
    + '<div class="timer"><span class="clock" id="clock">'+fmt(T.prep||T.speak)+'</span><span class="hint" id="phase">'+(T.prep?'1 phút chuẩn bị, ':'')+fmt(T.speak)+' nói</span>'
    + '<button class="primary" id="go">▶ Bắt đầu</button><button id="stop">■ Dừng</button></div>';
  $('#src').innerHTML = 'Nguồn: <a href="https://vstepowl.com/exam-reviews/de-thi/?exam=vlu-exam-'+cur+'&skill=speaking">vstepowl.com</a> · lưu để tự ôn cá nhân';
  document.querySelectorAll('#list a').forEach(a=>a.classList.toggle('active', +a.dataset.id===cur));
  $('#go').onclick=startTimer; $('#stop').onclick=stopTimer;
  try{ localStorage.setItem('vstep-speaking-last', JSON.stringify({cur,part})); }catch(e){}
  if(location.hash!=='#'+cur+'-'+part) history.replaceState(null,'','#'+cur+'-'+part);
}
function go(id,p=1){ cur=id; part=p; show(); $('#side').classList.remove('open'); window.scrollTo(0,0); }

function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const shown = ids.filter(id=>!q || (DATA[id].title+' '+DATA[id].parts.join(' ')).toLowerCase().includes(q));
  $('#list').innerHTML = shown.map(id=>{ const p3=lines(DATA[id].parts[2])[0]||''; return '<a href="#'+id+'-1" data-id="'+id+'">VLU '+id+'<small title="'+esc(p3)+'">'+esc(p3)+'</small></a>'; }).join('') || '<div class="hint">Không có đề nào khớp.</div>';
  document.querySelectorAll('#list a').forEach(a=>{ a.classList.toggle('active', +a.dataset.id===cur); a.onclick=e=>{e.preventDefault(); go(+a.dataset.id);} });
}

$('#count').textContent = ids.length;
$('#q').oninput = renderList;
$('#tabs').onclick = e=>{ const p=e.target.dataset.p; if(p){ part=+p; show(); } };
$('#rand').onclick = ()=> go(ids[Math.floor(Math.random()*ids.length)]);
$('#prev').onclick = ()=>{ const i=ids.indexOf(cur); if(i>0) go(ids[i-1]); };
$('#next').onclick = ()=>{ const i=ids.indexOf(cur); if(i<ids.length-1) go(ids[i+1]); };
$('#menu').onclick = ()=> $('#side').classList.toggle('open');
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight'){part=Math.min(3,part+1);show();} if(e.key==='ArrowLeft'){part=Math.max(1,part-1);show();} });

window.addEventListener('hashchange', ()=>{ const m=location.hash.match(/^#(\d+)-(\d)$/); if(m && DATA[m[1]] && (+m[1]!==cur || +m[2]!==part)){ cur=+m[1]; part=+m[2]; renderList(); show(); } });
const h = location.hash.match(/^#(\d+)-(\d)$/);
if(h && DATA[h[1]]){ cur=+h[1]; part=+h[2]; }
else { try{ const s=JSON.parse(localStorage.getItem('vstep-speaking-last')||'null'); if(s && DATA[s.cur]){ cur=s.cur; part=s.part; } }catch(e){} }
renderList(); show();
</script>
</body>
</html>

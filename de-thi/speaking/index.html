on 2: Study in the bedroom\nOption 3: Study in the library\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nResponsibility as a key factor for a successful life\n\nResponsibility and Success\nResponsibility toward family and society\nResponsibility in study and work\nBenefits of being responsible\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy is responsibility important in modern society?\n2\nCan a person be successful without being responsible? Why or why not?\n3\nHow can schools help students develop responsibility?"], "source": "pdf"}, "50": {"title": "Đề thi VLU 50", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about books\n\n1\nDo you enjoy reading books? Why or why not?\n2\nWhat kinds of books do you usually read?\n3\nHow often do you spend time reading books?\n\nNow, let’s talk about bank accounts\n\n4\nDo you have a bank account?\n5\nWhy do people need to have a bank account?\n6\nHave your habits of managing money changed compared to the past?", "SPEAKING — PART 2\n\nYour neighbor often makes a lot of noise at night, and you need to decide the best way to solve this problem.\n\nYou are considering the following options:\n\nOption 1: Move to another place\nOption 2: Talk to the neighbors directly\nOption 3: Report the problem to the police\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe reasons for divorce\n\nReasons for Divorce\nFinancial burden and economic problems\nLack of responsibility in family life\nCommunication problems between couples\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy has the divorce rate increased in modern society?\n2\nDo you think financial problems are the main cause of divorce? Why or why not?\n3\nHow can couples maintain a healthy and lasting relationship?"], "source": "pdf"}, "49": {"title": "Đề thi VLU 49", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about a good friend\n\n1\nDo you have a close friend? Please tell me about him or her.\n2\nWhat qualities do you think make a good friend?\n3\nHow has your good friend influenced your life?\n\nNow, let’s talk about public events\n\n4\nDo you often attend public events in your area?\n5\nWhat kinds of public events do you enjoy the most?\n6\nDo you think public events are important for local communities? Why?", "SPEAKING — PART 2\n\nYou are planning to buy a new house for your family and need to decide what factor is the most important.\n\nYou are considering the following options:\n\nOption 1: Choose a house with a low cost\nOption 2: Choose a house with a large size\nOption 3: Choose a house in a good location\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe disadvantages of self-employment\n\nSelf Employment Challenges\nFinancial instability and income uncertainty\nWork-life balance and stress\nLack of employee benefits and support\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many people still choose self-employment despite its disadvantages?\n2\nDo you think self-employment is more suitable for young people or experienced workers?\n3\nHow can self-employed people reduce the risks they face?"], "source": "pdf"}, "48": {"title": "Đề thi VLU 48", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about smartwatches\n\n1\nDo you think smart watches are necessary in daily life?\n2\nHave you ever used a smart watch?\n3\nWhat functions of a smart watch do you find most useful?\n\nNow, let’s talk about planning\n\n4\nWhat is your favorite type of plan?\n5\nDo you usually make plans before doing something important?\n6\nDo you think planning is important for people? Why or why not?", "SPEAKING — PART 2\n\nA group of scientists is visiting your school for a science research and education program. The school wants to organize an activity for students to learn more about science.\n\nYou are considering the following options:\n\nOption 1: Organize a science game activity\nOption 2: Organize a science talk show\nOption 3: Donate science books to the school library\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe Importance of Body Language in Communication\n\nBody Language\nCommon types of body language\nBenefits in communication\nBody language in study and work\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think body language is more important than spoken language? Why or why not?\n2\nHow can people improve their body language skills?\n3\nHas technology changed the way people use body language in communication?"], "source": "pdf"}, "47": {"title": "Đề thi VLU 47", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your free time\n\n1\nWhat do you usually do in your free time?\n2\nWhich part of the day do you like the most? Why?\n3\nWhat do you do to manage your time effectively?\n\nNow, let’s talk about noise\n\n4\nDo you prefer living in a quiet place or a noisy place? Why?\n5\nWhat type of noise do you dislike the most?\n6\nHow does noise affect people's health?", "SPEAKING — PART 2\n\nYour friend has been feeling stressed recently and wants to improve their mental well-being.\n\nYou are considering the following options:\n\nOption 1: Learn a new skill\nOption 2: Take up a new sport\nOption 3: Participate in volunteer activities\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nBenefits of Owning a Private Car\n\nPrivate Car Ownership\nA symbol of social status\nConvenience for long-distance travel\nProtection from bad weather\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are the disadvantages of owning a private car?\n2\nHow did the number of private cars increase in Vietnam during the twentieth century?\n3\nHow do you think car ownership will change in the future, and will people continue to use cars?"], "source": "pdf"}, "46": {"title": "Đề thi VLU 46", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about healthy activities\n\n1\nDo you do any healthy activities in your daily life?\n2\nWhat do you think people need to maintain a healthy activity regularly?\n3\nIs there any bad habit you would like to improve? Why?\n\nNow, let’s talk about restaurants\n\n4\nWho do you usually go to restaurants with?\n5\nCan you tell me about the first time you went to a restaurant?\n6\nDo you enjoy eating at restaurants? Why or why not?", "SPEAKING — PART 2\n\nYour friend wants to buy a birthday gift for her grandmother who is celebrating her 60th birthday.\n\nYou are considering the following options:\n\nOption 1: Books\nOption 2: A dress\nOption 3: A holiday\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nBenefits of Soft Skills\n\nSoft Skills\nCommunication skills\nTeamwork and collaboration\nBenefits for academic success\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think it is easy to develop soft skills? Why or why not?\n2\nWhat skills are important for academic success?\n3\nDo young people today have better soft skills than previous generations? Why?"], "source": "pdf"}, "45": {"title": "Đề thi VLU 45", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about milk tea\n\n1\nDo you like drinking milk tea? Why or why not?\n2\nWhy do many young people enjoy drinking milk tea nowadays?\n3\nWhat milk tea brand or flavor is popular in your country?\n\nNow, let’s talk about eating out\n\n4\nWhat are the benefits of eating out?\n5\nHow often do you eat out with your friends or family?\n6\nDo you prefer eating out or eating at home? Why?", "SPEAKING — PART 2\n\nYou have a free weekend and want to choose the best way to relax and enjoy your time.\n\nYou are considering the following options:\n\nOption 1: Go shopping at a mall or local market\nOption 2: Enjoy yourself by staying at home and relaxing\nOption 3: Spend time at a café with friends\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of reading books\n\nBenefits of Reading\nLearning new knowledge and information\nImprovi -up Questions:\n\n1\nWhy is tourism important for a country's economy?\n2\nWhat problems can tourism bring to local communities?\n3\nHow can young people help promote tourism in their country?"], "source": "pdf"}, "41": {"title": "Đề thi VLU 41", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about colors\n\n1\nDo you think colors are important in daily life?\n2\nDo you prefer dark colors or bright colors? Why?\n3\nWhat can people learn from other people's favorite colors?\n\nNow, let’s talk about saving money\n\n4\nDid you learn to save money when you were young?\n5\nWho usually gave you more money, your father or your mother?\n6\nDo you enjoy saving money? Why or why not?", "SPEAKING — PART 2\n\nYour friend is looking for a new job but cannot decide what is most important.\n\nYou are considering the following options:\n\nOption 1: Choose a workplace that is safe and stable\nOption 2: Choose a job with a high salary\nOption 3: Choose a job with good opportunities for promotion\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of recycling\n\nBenefits of Recycling\nProtecting the environment and reducing pollution\nCreating jobs and supporting the economy\nSaving and reusing natural resources\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat should governments do to make recycling more effective?\n2\nDo you think young people are more interested in recycling today?\n3\nHow can schools encourage students to recycle more often?"], "source": "pdf"}, "40": {"title": "Đề thi VLU 40", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about volunteer work\n\n1\nDo you often take part in volunteer work?\n2\nDo you enjoy doing volunteer activities? Why or why not?\n3\nAre volunteer activities common in the place where you live?\n\nNow, let’s talk about noise\n\n4\nDo you think noise is a problem in modern cities?\n5\nWhat kinds of noise annoy you the most?\n6\nHow can people reduce noise pollution in daily life?", "S e best option and explain your reasons.", "SPEAKING — PART 3\n\nAdvantages of owning a pet\n\nOwning a Pet\nReducing loneliness\nEncouraging exercise and outdoor activities\nMaking life more interesting and enjoyable\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think people should keep dogs or cats as pets? Why?\n2\nWhat are some difficulties of owning a pet?\n3\nWhat can people learn from raising pets?"], "source": "pdf"}, "36": {"title": "Đề thi VLU 36", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your hobbies\n\n1\nWhat is your favorite hobby in your free time?\n2\nHow often do you spend time on your hobby?\n3\nWhy do you think hobbies are important for students?\n\nNow, let’s talk about traveling\n\n4\nDo you enjoy traveling? Why or why not?\n5\nWhat is your favorite place to visit when traveling?\n6\nDo you prefer traveling alone or with other people?", "SPEAKING — PART 2\n\nYour class is going on a trip to Ha Noi and needs to decide what to eat for lunch during the journey.\n\nYou are considering the following options:\n\nOption 1: Fried rice\nOption 2: Beef noodle soup\nOption 3: Spring rolls\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nBenefits of traveling in groups\n\nGroup Travel Benefits\nSharing travel expenses\nImproving communication and teamwork\nCreating memorable experiences together\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many young people enjoy traveling with friends?\n2\nWhat problems can happen during group trips?\n3\nDo you think group travel is better than solo travel?"], "source": "pdf"}, "35": {"title": "Đề thi VLU 35", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about colors\n\n1\nDo you prefer dark colors or light colors? Why?\n2\nDo you think colors are important when choosing clothes?\n3\nWhat can a person's favorite color say about their personality?\n\nNow, let’s talk about money\n\n4\nDid you save money or spend money wisely when you were a child? udents nowadays experience a lot of pressure during exams?\n2\nDo you think parents contribute to students' stress? Why or why not?\n3\nWhat can schools do to reduce pressure on students?"], "source": "pdf"}, "33": {"title": "Đề thi VLU 33", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about movies\n\n1\nWho is your favorite actor or actress? Why do you like him or her?\n2\nWhat kind of movies do you enjoy watching the most?\n3\nDo you like watching movies at the cinema? Why or why not?\n\nNow, let’s talk about friends\n\n4\nHow often do you spend time with your friends?\n5\nWhat activities do you usually do with your friends?\n6\nDo you think friendship is important in life? Why?", "SPEAKING — PART 2\n\nYour friend is going to graduate soon and you want to choose a meaningful gift for him or her.\n\nYou are considering the following options:\n\nOption 1: A handmade gift\nOption 2: A useful book\nOption 3: Movie tickets\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of staying healthy\n\nStaying Healthy\nEat healthy food\nDo more exercise\nManage stress effectively\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many young people have unhealthy lifestyles nowadays?\n2\nDo you think schools should teach students more about healthy habits?\n3\nHow can people balance work or study with physical exercise?"], "source": "pdf"}, "32": {"title": "Đề thi VLU 32", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about traveling\n\n1\nDo you enjoy traveling in your free time? Why or why not?\n2\nWhat kind of places do you usually like to visit when traveling?\n3\nWho do you usually travel with and why?\n\nNow, let’s talk about the Internet\n\n4\nHow often do you use the Internet every day?\n5\nWhat do you usually use the Internet for?\n6\nDo you think the Internet has changed the way people communicate? Why?", "SPEAKING — PART 2\n\nYour friend wants to learn how to play the guitar but does not know the best way to start.\n\nYou are considering the following options:\n\nOption 1: Take guitar classes at a music center\nOption 2: Learn guitar online through videos and apps\nOption 3: Ask a friend who can play guitar to teach him or her\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of maintaining work-life balance\n\nWork-Life Balance\nBenefits of work-life balance\nProblems caused by work pressure\nWays to maintain a healthy lifestyle\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many people find it difficult to maintain work-life balance nowadays?\n2\nDo you think technology makes work-life balance better or worse?\n3\nWhat can companies do to help employees reduce stress?"], "source": "pdf"}, "31": {"title": "Đề thi VLU 31", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your goals\n\n1\nWhat is your current goal?\n2\nWhy is this goal important to you?\n3\nHow are you trying to achieve your goal?\n\nNow, let’s talk about your daily routine\n\n4\nWhat is your daily routine like?\n5\nDo you want to change your daily routine? Why or why not?\n6\nDo you think having a good routine is important?", "SPEAKING — PART 2\n\nA company wants to reduce stress in the workplace.\n\nYou are considering the following options:\n\nOption 1: Reduce deadlines for employees\nOption 2: Organize team-building and relaxation activities\nOption 3: Allow employees to work from home more often\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nWays to reduce stress in modern life\n\nReducing Stress\nCommon causes of stress in daily life\nWays people relax and reduce stress\nThe role of work-life balance\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many people experience stress nowadays?\n2\nDo you think technology increases stress?\n3\nWhat should employers do to help workers reduce stress?"], "source": "pdf"}, "30": {"title": "Đề thi VLU 30", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about personal achievements\n\n1\nWhat is your biggest personal achievement so far?\n2\nHow did you achieve that success?\n3\nWhy are personal achievements important to young people?\n\nNow, let’s talk about advertisements\n\n4\nDo you often pay attention to advertisements?\n5\nWhat kinds of advertisements do you like the most?\n6\nDo you think advertisements influence people's buying decisions?", "SPEAKING — PART 2\n\nYour friend wants to improve his or her English skills.\n\nYou are considering the following options:\n\nOption 1: Take English classes\nOption 2: Make friends with native speakers\nOption 3: Travel abroad\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nWhat people do to make life better\n\nMaking Life Better\nWays people improve their physical and mental health\nHow people help their communities and society\nThe importance of education and personal development\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do many people want to improve their quality of life?\n2\nDo you think technology makes life better or worse?\n3\nWhat should young people do to have a happier life?"], "source": "pdf"}, "29": {"title": "Đề thi VLU 29", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about films\n\n1\nDo you enjoy watching films? Why or why not?\n2\nWhat kind of films do you like the most?\n3\nWhat can people learn from films?\n\nNow, let’s talk about competitions\n\n4\nWhen was the last time you took part in a competition?\n5\nDid you enjoy that competition? Why or why not?\n6\nDo you think competitions are important for young people?", "SPEAKING — PART 2\n\nYou are preparing for an important exam and need to choose the best place to revise.\n\nYou are considering the following options:\n\nOption 1: Study at the university library\nOption 2: Study at a quiet coffee shop\nOption 3: Study at home\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nHow to encourage children to do charity work\n\nChildren and Charity Work\nKinds of charity activities people often do\nReasons why people do charity work\nDisadvantages of donating money to charity\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy is charity work important for children?\n2\nShould schools encourage students to join charity activities?\n3\nWhat are some problems related to charity organizations?"], "source": "pdf"}, "28": {"title": "Đề thi VLU 28", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about shopping\n\n1\nDo you enjoy going shopping? Why or why not?\n2\nWhere do you usually go shopping?\n3\nWhat should people pay attention to when buying something?\n\nNow, let’s talk about your family\n\n4\nWho are you closest to in your family?\n5\nWhat activities do you usually do with your family?\n6\nHow important is family time to you?", "SPEAKING — PART 2\n\nYour friend is going to study in the USA and you want to buy a farewell gift.\n\nYou are considering the following options:\n\nOption 1: Buy a pair of headphones\nOption 2: Buy a picture frame\nOption 3: Buy a watch\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of teamwork in young people's lives\n\nImportance of Teamwork\nBenefits of teamwork in study and work\nSkills developed through teamwork\nProblems people may face in teamwork\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy is teamwork important for students nowadays?\n2\nDo you think schools should organize more group activities?\n3\nWhat can people do to become better team members?"], "source": "pdf"}, "27": {"title": "Đề thi VLU 27", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about parties\n\n1\nWhat activity do you like best at parties?\n2\nHow do you usually dress when attending parties?\n3\nDo you enjoy making new friends at parties?\n\nNow, let’s talk about recycling\n\n4\nHow often do you recycle?\n5\nWhat items do you usually recycle?\n6\nWhat do you think are the benefits of recycling?", "SPEAKING — PART 2\n\nYour friend is an IT student who is about to graduate. He is very creative and is considering different career options after graduation.\n\nYou are considering the following options:\n\nOption 1: Become a graphic designer\nOption 2: Work as an IT support specialist\nOption 3: Become a digital content creator\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nResponsibilities of pet owners\n\nPet Owner Responsibilities\nProviding proper nutrition for pets\nEnsuring pets get enough exercise\nGiving pets companionship and care\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat pets are popular in your country?\n2\nWhat are the benefits of children keeping pets?\n3\nWhat are the harmful effects of keeping pets?"], "source": "pdf"}, "26": {"title": "Đề thi VLU 26", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your weekends\n\n1\nWhat do you usually do on weekends?\n2\nHow important are weekends to you?\n3\nDo you think weekends are long enough for you to relax and recharge?\n\nNow, let’s talk about happiness\n\n4\nDo you consider yourself a happy person?\n5\nWhat usually makes you feel happy in daily life?\n6\nHow does the weather affect your mood?", "SPEAKING — PART 2\n\nA group of exchange students is coming to your university. The school wants to choose a traditional Vietnamese symbol to welcome them.\n\nYou are considering the following options:\n\nOption 1: Give them lotus flowers\nOption 2: Prepare conical hats for them\nOption 3: Introduce Vietnamese ao dai\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nMethods to protect the environment\n\nProtecting the Environment\nReducing the use of plastic bags\nUsing public transportation\nRaising environmental awareness among young people\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy is environmental protection important nowadays?\n2\nDo you think young people care enough about environmental issues?\n3\nWhat can schools do to encourage students to protect the environment?"], "source": "pdf"}, "25": {"title": "Đề thi VLU 25", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about job interviews\n\n1\nHave you ever attended a job interview? What was it like?\n2\nWhat do you think is the most important factor to succeed in a job interview?\n3\nHow do you usually prepare yourself before meeting a potential employer?\n\nNow, let’s talk about shopping\n\n4\nDo you enjoy going shopping in your free time? Why or why not?\n5\nDo you prefer shopping at traditional markets or modern supermarkets?\n6\nWhat are some advantages of shopping online compared to shopping in person?", "SPEAKING — PART 2\n\nYour school is organizing a 4th-anniversary celebration, and there is a workshop to help students prepare for job interviews. You need to decide which session would be most beneficial for the participants.\n\nYou are considering the following options:\n\nOption 1: How to write a professional CV\nOption 2: Developing essential skills in the workplace\nOption 3: Making a great impression in a job interview\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nDrawbacks of using AI tools for learning\n\nDrawbacks of AI in Learning\nReduction in critical thinking and creativity\nPotential for academic dishonesty and cheating\nReliability and accuracy of information\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think AI will eventually replace teachers in the classroom?\n2\nHow can students use AI tools effectively without becoming dependent on them?\n3\nShould universities ban the use of AI tools like ChatGPT for assignments?"], "source": "pdf"}, "24": {"title": "Đề thi VLU 24", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about family communication\n\n1\nHow much time do you spend talking with your family members every day?\n2\nWhat topics do you usually discuss when you gather with your family?\n3\nDo you think it is important for family members to talk to each other regularly? Why?\n\nNow, let’s talk about games\n\n4\nDo you like playing games in your free time? What kind of games?\n5\nDid you play the same games when you were a child? Why or why not?\n6\nDo you prefer playing games alone or with friends? Why?", "SPEAKING — PART 2\n\nA new student has just joined your class, and you want to suggest a club for them to join.\n\nYou are considering the following options:\n\nOption 1: A music club\nOption 2: A sports club\nOption 3: An English speaking club\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of trees in our environment\n\nBenefits of Trees\nProviding oxygen and fresh air\nReducing global warming\nOffering shade and beauty\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are the consequences of deforestation?\n2\nHow can we encourage people to plant more trees?\n3\nDo you think city life needs more green spaces? Why?"], "source": "pdf"}, "23": {"title": "Đề thi VLU 23", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your house\n\n1\nHow many rooms are there in your house?\n2\nWhich room in your house do you like most? Why?\n3\nWhat do you usually do in your favorite room?\n\nNow, let’s talk about shopping\n\n4\nDo you enjoy going shopping in your free time?\n5\nDo you prefer shopping at traditional markets or modern supermarkets?\n6\nIs shopping a popular leisure activity in your country? Why?", "SPEAKING — PART 2\n\nA foreign teacher of yours is going back to his country, and you want to give him a farewell gift.\n\nYou are considering the following options:\n\nOption 1: A painting of a lotus flower\nOption 2: Vietnamese coffee\nOption 3: Hand-made items\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of traveling\n\nBenefits of Traveling\nLearning about different cultures\nMaking new friends\nReducing stress and relaxing\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are the potential disadvantages of traveling rsity and you are considering where to live.\n\nYou are considering the following options:\n\nOption 1: Sharing a room with other students in a dormitory\nOption 2: Renting a private room in a boarding house\nOption 3: Living with a relative's family\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of preserving traditional festivals\n\nPreserving Festivals\nPromote cultural values and national identity\nBoost tourism and local economy\nStrengthen family and community bonds\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think young people today still care about traditional festivals?\n2\nHow has the way people celebrate festivals changed over the last 20 years?\n3\nShould the government spend more money on organizing festivals?"], "source": "pdf"}, "20": {"title": "Đề thi VLU 20", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about fashion\n\n1\nWhat kind of clothes do you usually like to wear?\n2\nDo you prefer buying clothes online or in a shop? Why?\n3\nDo you think fashion is important in our daily lives?\n\nNow, let’s talk about inventions\n\n4\nIn your opinion, what is the most useful invention in the world?\n5\nHow has the internet changed the way people live today?\n6\nWhat kind of new invention would you like to see in the future?", "SPEAKING — PART 2\n\nA first-year student is wondering which item is the most essential to purchase for their university life.\n\nYou are considering the following options:\n\nOption 1: A high-end smartphone\nOption 2: A powerful laptop\nOption 3: A new motorbike\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe impacts of Artificial Intelligence (AI) on modern life\n\nImpacts of AI\nImproving efficiency in work and study\nProviding personalized entertainment and services\nPotential risks such as job displacement and privacy concerns\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think AI will replace human teachers in the future?\n2\nHow can students use AI tools effectively without becoming lazy?\n3\nWhat are the ethical concerns regarding AI development?"], "source": "pdf"}, "19": {"title": "Đề thi VLU 19", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about shopping\n\n1\nDo you enjoy going shopping in your free time?\n2\nDo you prefer shopping online or going to physical stores? Why?\n3\nWhat was the last thing you bought that made you happy?\n\nNow, let’s talk about your studies\n\n4\nWhat are you currently studying, and do you enjoy it?\n5\nIs it easier for you to study in the morning or in the evening?\n6\nWhat is the most difficult subject for you to study? Why?", "SPEAKING — PART 2\n\nYou and your friends are planning a holiday after a stressful semester.\n\nYou are considering the following options:\n\nOption 1: Booking a package tour\nOption 2: Staying at home and relaxing\nOption 3: Going backpacking\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of mobile phones in modern life\n\nMobile Phones\nCommunication through calls, messages and social media\nEntertainment such as music, movies and games\nEducation and work support through apps and online resources\n[your own ideas]\n\nFollow-up Questions:\n\n1\nAt what age should children be given their first mobile phone?\n2\nDo you think people are becoming too dependent on their phones?\n3\nWhat are some negative effects of using mobile phones for too long?"], "source": "pdf"}, "18": {"title": "Đề thi VLU 18", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about colors\n\n1\nWhat is your favorite color to decorate your house with?\n2\nDo you think the color of your clothes can affect your mood?\n3\nDo you usually spend a lot of time choosing clothes to wear?\n\nNow, let’s talk about music\n\n4\nWhat kind of music do you like listening to the most?\n5\nIs music important to you in your daily life? Why?\n6\nDo you prefer listening to music alone or with other people?", "SPEAKING — PART 2\n\nYour teacher is going to retire, and your class wants to buy a farewell gift.\n\nYou are considering the following options:\n\nOption 1: A luxury handbag\nOption 2: A pair of shoes\nOption 3: A pair of glasses\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of staying in a university dormitory\n\nStaying in Dormitory\nMaking new friends\nLearning independent living skills\nBeing close to classmates and campus activities\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDoes staying in a dormitory help with your university studies?\n2\nWhat are the difficulties students face when living in a dormitory?\n3\nWhat advice would you give to students who are going to stay in a dormitory for the first time?"], "source": "pdf"}, "17": {"title": "Đề thi VLU 17", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about money\n\n1\nWhat do you usually spend your money on?\n2\nHave you ever overspent your budget? Why or why not?\n3\nWhat are some effective ways to save money for the future?\n\nNow, let’s talk about the Internet\n\n4\nWhat do you usually use the Internet for in your daily life?\n5\nHow has the Internet made your life more convenient?\n6\nDo you think people are spending too much time on the Internet nowadays?", "SPEAKING — PART 2\n\nYou are planning to have a pet to keep you company at home.\n\nYou are considering the following options:\n\nOption 1: A cat\nOption 2: A dog\nOption 3: A fish\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of using electric cars\n\nBenefits of Electric Cars\nReduce environmental pollution\nSave money on fuel and maintenance\nConserve natural resources\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are some disadvantages of using electric cars at the moment?\n2\nHow can the government encourage people to use electric vehicles?\n3\nDo you think electric cars will completely replace petrol cars in the future?"], "source": "pdf"}, "16": {"title": "Đề thi VLU 16", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about movies\n\n1\nDo you often watch movies?\n2\nWhat kinds of movies do you usually watch? Why do you enjoy them?\n3\nWhat can people learn from watching movies?\n\nNow, let’s talk about competitions\n\n4\nWhen was the last time you took part in a competition?\n5\nDo you enjoy participating in competitions? Why or why not?\n6\nWhat kinds of competitions are popular in your country?", "SPEAKING — PART 2\n\nA group of students wants to organize an event to promote environmental awareness at their university.\n\nYou are considering the following options:\n\nOption 1: A campus cleanup day where students pick up trash together\nOption 2: A seminar with environmental experts and guest speakers\nOption 3: A photo contest themed 'Nature Protection' on social media\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of online learning for university students\n\nOnline Learning Benefits\nFlexibility of time and location\nCost-effectiveness for students\nDevelopment of digital and independent learning skills\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are the main challenges students face when learning online?\n2\nDo you think online learning will replace traditional classrooms in the future?\n3\nHow can teachers make online classes more interactive?"], "source": "pdf"}, "15": {"title": "Đề thi VLU 15", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your family\n\n1\nDo you live in a big or a small family?\n2\nHow much time do you spend with your family members?\n3\nWhat do you like to do together with your family on weekends?\n\nNow, let’s talk about holidays\n\n4\nWhat are the most popular holidays in your country?\n5\nWhat do you usually do during these holidays?\n6\nDo you think holidays are becoming more commercialized in your country? Why?", "SPEAKING — PART 2\n\nYour younger brother has just graduated from universit nguage? Why?\n2\nDo you think English will remain the most important global language in the future?\n3\nHow has the internet changed the way people learn English?"], "source": "pdf"}, "13": {"title": "Đề thi VLU 13", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about traveling\n\n1\nDo you like traveling? Why or why not?\n2\nWhat was the most memorable trip you have ever taken?\n3\nDo you prefer traveling alone or in a group? Why?\n\nNow, let’s talk about good habits\n\n4\nWhat is one good habit that you have?\n5\nDo you think it is difficult to break a bad habit?\n6\nHow can parents help their children form healthy habits from a young age?", "SPEAKING — PART 2\n\nYour team is planning to create a presentation about Vietnam's identity to show to international students.\n\nYou are considering the following options:\n\nOption 1: A significant historical event in Vietnam\nOption 2: A traditional cultural festival\nOption 3: A significant economic achievement of the country\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe negative effects of exam pressure on students\n\nExam Pressure Effects\nPhysical health problems (lack of sleep, fatigue)\nMental health issues (stress, anxiety)\nLoss of interest in learning\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy do you think students today face more pressure than in the past?\n2\nHow can teachers and parents reduce the stress on students?\n3\nDo you think exams are the best way to evaluate a student's ability?"], "source": "pdf"}, "12": {"title": "Đề thi VLU 12", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about cooking\n\n1\nDo you like cooking? Why or why not?\n2\nWho usually does the cooking in your family?\n3\nWhat is a popular dish that people in your country like to cook?\n\nNow, let’s talk about social events\n\n4\nDo you enjoy attending social events like parties or festivals?\n5\nWhat was the last social event you went to?\n6\nIs it important to have social  which soft skill is the most difficult to learn?\n2\nDo you think schools should replace some academic subjects with soft skills training?\n3\nHow have soft skills helped you in your personal life or studies?"], "source": "pdf"}, "10": {"title": "Đề thi VLU 10", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about holidays\n\n1\nWhat is your favorite holiday of the year? Why?\n2\nWhat do you usually do during your holidays?\n3\nDo you prefer spending holidays at home or going to another city?\n\nNow, let’s talk about memories\n\n4\nDo you have a good memory or do you often forget things?\n5\nWhat is your earliest childhood memory that you can still remember?\n6\nHow do you usually keep memories of your trips? Do you take photos or write a diary?", "SPEAKING — PART 2\n\nA school is planning to organize an educational program for its students.\n\nYou are considering the following options:\n\nOption 1: A tour of artistic architecture in the city\nOption 2: A traditional folk music performance and workshop\nOption 3: A field trip related to local geography\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe impacts of technology on our modern life\n\nImpacts of Technology\nFaster communication and connection\nImproved access to education and information\nPotential health and privacy issues\n[your own ideas]\n\nFollow-up Questions:\n\n1\nHow has technology changed the way people work in recent years?\n2\nDo you think children should be allowed to use smartphones at an early age?\n3\nWhat are some ways we can protect our privacy online?"], "source": "pdf"}, "9": {"title": "Đề thi VLU 9", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about happiness\n\n1\nWhat makes you feel happy in your daily life?\n2\nDo you think money is the most important factor for happiness? Why or why not?\n3\nWhat do you usually do to cheer yourself up when you are sad?\n\nNow, let’s talk about traveling\n\n4\nDo you like traveling to new places? f time\nWaste of money\nRisk of injuries\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo the benefits of exercise outweigh the disadvantages?\n2\nHow can people avoid injuries while working out?\n3\nIs it necessary to spend a lot of money on a gym membership?"], "source": "pdf"}, "7": {"title": "Đề thi VLU 7", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about email\n\n1\nHow often do you write or send emails in your daily life?\n2\nDo you prefer communicating via email or social media? Why?\n3\nWhat are some common problems you face when using email?\n\nNow, let’s talk about school subjects\n\n4\nWhat was your favorite subject when you were at school?\n5\nIs there any subject you didn't like? Why not?\n6\nDo you think students should be allowed to choose the subjects they want to study?", "SPEAKING — PART 2\n\nYour class is preparing for a graduation ceremony and needs to assign students to different committees.\n\nYou are considering the following options:\n\nOption 1: The Guest Invitation Committee (handling guest lists and invitations)\nOption 2: The Decoration and Design Committee (handling the look of the venue)\nOption 3: The Art and Drawing Committee (creating hand-drawn posters and souvenirs)\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of learning English\n\nBenefits of English\nBetter job opportunities in international companies\nAccess to a vast amount of online knowledge and entertainment\nEasier travel and communication with people worldwide\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat is the most difficult part of learning English for you?\n2\nDo you think English will remain the most popular language in the future?\n3\nHow has the internet changed the way people learn English?"], "source": "pdf"}, "6": {"title": "Đề thi VLU 6", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about your childhood\n\n1\nWhat is your funniest memory from your childhood?\n2\nDid you prefer playing indoors or outdoors when you were a child?\n3\nHow has your hometown changed since you were a kid?\n\nNow, let’s talk about your health\n\n4\nWhat do you do to stay healthy every day?\n5\nDo you think people in your country have a healthy diet?\n6\nHow important is it to get enough sleep for our health?", "SPEAKING — PART 2\n\nA foreign friend is coming to visit Vietnam for the first time and wants to have the best experience.\n\nYou are considering the following options:\n\nOption 1: Going on a guided food tour in the city\nOption 2: Visiting historical museums and landmarks\nOption 3: Taking a homestay trip to a rural village\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe qualities and challenges of women in leadership roles\n\nWomen Leaders\nStrong emotional intelligence (EQ)\nPromoting diversity and inclusion\nBalancing work and family life\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhy are there fewer women in leadership positions compared to men?\n2\nDo you think women lead differently than men?\n3\nHow can society encourage more women to become leaders?"], "source": "pdf"}, "5": {"title": "Đề thi VLU 5", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about farms\n\n1\nHave you ever visited a farm? When was that?\n2\nWhat kinds of animals or crops are common on farms in your country?\n3\nDo you think life on a farm is better than life in a big city? Why?\n\nNow, let’s talk about the weather\n\n4\nWhat is your favorite type of weather? Why?\n5\nDoes the weather affect your mood or daily activities? How?\n6\nWhat do you usually do when the weather is bad and you cannot go out?", "SPEAKING — PART 2\n\nYour friend is currently staying in the hospital due to an illness. You want to give him a gift to encourage him.\n\nYou are considering the following options:\n\nOption 1: A flower pot\nOption 2: Colored pencils and a drawing book\nOption 3: Healthy food\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of leadership skills\n\nImportance of Leadership\nContributing to organizational development\nImproving communication among members\nMaking beneficial decisions\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think leaders are born or made through practice?\n2\nWhat are the most important qualities of a good leader?\n3\nHow can students develop leadership skills while at university?"], "source": "pdf"}, "4": {"title": "Đề thi VLU 4", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about shopping\n\n1\nDo you enjoy going shopping in your free time? Why?\n2\nWhat do you usually buy when you go shopping?\n3\nDo you prefer shopping online or going to a physical store?\n\nNow, let’s talk about your family\n\n4\nWho is the family member you are closest to? Why?\n5\nHow much time do you spend with your family every week?\n6\nDo you think it is important for family members to have meals together? Why?", "SPEAKING — PART 2\n\nYour best friend is going to celebrate their birthday soon, and you are choosing a special gift.\n\nYou are considering the following options:\n\nOption 1: A handmade gift (like a scrapbook or a knitted scarf)\nOption 2: A high-tech gadget (like a smartwatch or wireless earbuds)\nOption 3: A gift voucher for a favorite clothing store or restaurant\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of teamwork in modern life\n\nTeamwork\nIncrease work productivity\nExchange ideas and learn new skills\nReduce individual stress and workload\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you prefer working alone or in a group? Why?\n2\nWhat qualities make a person a good team member?\n3\nHow can leaders encourage teamwork among their employees?"], "source": "pdf"}, "3": {"title": "Đề thi VLU 3", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about restaurants\n\n1\nHow often do you go to a restaurant to eat?\n2\nWhat do you like most about eating at a restaurant?\n3\nDo you prefer traditional restaurants or modern ones? Why?\n\nNow, let’s talk about the Internet\n\n4\nHow often do you use the internet in your daily life?\n5\nWhat are the main things you do when you are online?\n6\nDo you think being online too much has any negative effects? Why?", "SPEAKING — PART 2\n\nYou want to buy a book as a gift for your nephew and you are considering three options.\n\nYou are considering the following options:\n\nOption 1: An adventure book\nOption 2: A fiction book\nOption 3: A non-fiction book\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe importance of staying calm in difficult situations\n\nStaying Calm\nThink clearly and make better decisions\nReduce stress and improve health\nMaintain good relationships with others\n[your own ideas]\n\nFollow-up Questions:\n\n1\nDo you think older people are better at staying calm than younger people?\n2\nWhat are some effective ways to stay calm in a stressful situation?\n3\nWhy do some people find it difficult to control their emotions?"], "source": "pdf"}, "2": {"title": "Đề thi VLU 2", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about restaurants\n\n1\nHow often do you go to restaurants to eat?\n2\nWhat is your favorite type of restaurant and why do you like it?\n3\nDo you prefer eating at a restaurant or at home? Why?\n\nNow, let’s talk about holidays\n\n4\nWhat is your favorite holiday of the year?\n5\nWhat do you usually do during your holidays?\n6\nDo you prefer to spend your holidays at home or travel to a new place? Why?", "SPEAKING — PART 2\n\nYour family is planning a vacation together and you are choosing the destination.\n\nYou are considering the following options:\n\nOption 1: Going to the beach\nOption 2: Going to the mountains\nOption 3: Visiting another city\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nThe benefits of studying abroad for students\n\nLearning Abroad\nHave better job opportunities\nDevelop an independent life\nMake international friends\n[your own ideas]\n\nFollow-up Questions:\n\n1\nWhat are some difficulties that students have to face when studying abroad?\n2\nDo you think students should work part-time while studying in a foreign country?\n3\nIs it necessary to learn the local language before going to study abroad? Why?"], "source": "pdf"}, "1": {"title": "Đề thi VLU 1", "parts": ["SPEAKING — PART 1\n\nQuestions:\n\nLet’s talk about money\n\n1\nDo you use money often in your daily life?\n2\nHow should children be taught to use money wisely?\n3\nWhat is the most expensive thing you have ever bought?\n\nNow, let’s talk about your meals\n\n4\nDo you often have breakfast in the morning?\n5\nWhat kind of food do you usually eat for your meals?\n6\nDo you think you have a healthy lifestyle? Why or why not?", "SPEAKING — PART 2\n\nYou are going to celebrate your birthday and are considering three options for the party.\n\nYou are considering the following options:\n\nOption 1: Having a big party with many people\nOption 2: Having a small gathering with only close friends and family\nOption 3: Celebrating alone\n\nChoose the best option and explain your reasons.", "SPEAKING — PART 3\n\nFactors to consider when choosing a job\n\nChoosing a Job\nSalary and benefits\nWorking environment\nCareer promotion opportunities\n[your own ideas]\n\nFollow-up Questions:\n\n1\nIs salary the most important factor when choosing a job? Why?\n2\nDo you prefer working for a big company or a small start-up?\n3\nShould young people change jobs frequently to gain more experience?"], "source": "pdf"}};
const ids = Object.keys(DATA).map(Number).sort((a,b)=>b-a);
const TIME = {1:{prep:0,speak:180},2:{prep:60,speak:180},3:{prep:60,speak:240}};
let cur = ids[0], part = 1, tick = null;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function lines(t){ return t.split('\n').slice(1).map(s=>s.trim()).filter(Boolean); }
function questions(arr){ const q=[]; for(let i=0;i<arr.length;i++){ if(/^\d+$/.test(arr[i]) && arr[i+1]){ q.push(arr[i+1]); i++; } } return q; }

function renderP1(t){
  const L = lines(t).filter(s=>s!=='Questions:'); let html='', buf=[];
  const flush=()=>{ if(buf.length){ html+='<ol>'+questions(buf).map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>'; buf=[]; } };
  let n=0;
  for(const s of L){ if(/^(Now, )?let.s talk about/i.test(s)){ flush(); html+='<div class="topic">'+esc(s)+'</div>'; } else buf.push(s); }
  flush();
  // keep original numbering across the two topics
  return html.replace(/<ol>/g, () => { const start = n*3+1; n++; return '<ol start="'+start+'">'; });
}
function renderP2(t){
  const L = lines(t); const opts=L.filter(s=>/^Option \d+:/.test(s));
  const sit = L[0]; const task = L.find(s=>/^Choose/.test(s))||'';
  return '<p class="situation">'+esc(sit)+'</p><div class="opts">'+opts.map(o=>{const m=o.match(/^(Option \d+):\s*(.*)$/);return '<div class="opt"><b>'+m[1]+'</b>'+esc(m[2])+'</div>';}).join('')+'</div><p class="task">'+esc(task)+'</p>';
}
function renderP3(t){
  const L = lines(t); const fi = L.indexOf('Follow-up Questions:');
  const topic = L[0], mind = L.slice(1, fi<0?L.length:fi), fq = fi<0?[]:questions(L.slice(fi+1));
  const [center, ...nodes] = mind;
  return '<div class="topic" style="font-size:18px">'+esc(topic)+'</div>'
    + '<div class="mind"><div class="center">'+esc(center||'')+'</div>'+nodes.map(n=>'<div class="node'+(/your own/i.test(n)?' own':'')+'">'+esc(n)+'</div>').join('')+'</div>'
    + (fq.length?'<div class="topic">Follow-up questions</div><ol>'+fq.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>':'');
}
const R = {1:renderP1,2:renderP2,3:renderP3};
const NAME = {1:'Part 1 · Social interaction',2:'Part 2 · Solution discussion',3:'Part 3 · Topic development'};

function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function stopTimer(){ clearInterval(tick); tick=null; }
function startTimer(){
  stopTimer(); const T=TIME[part]; let phase=T.prep?'prep':'speak', left=T.prep||T.speak;
  const c=$('#clock'), lab=$('#phase');
  const draw=()=>{ c.textContent=fmt(left); c.className='clock '+phase; lab.textContent=phase==='prep'?'Chuẩn bị':'Đang nói'; };
  draw();
  tick=setInterval(()=>{ left--; if(left<0){ if(phase==='prep'){ phase='speak'; left=T.speak; } else { stopTimer(); c.textContent='Hết giờ'; lab.textContent=''; return; } } draw(); },1000);
}

function show(){
  stopTimer();
  const ex = DATA[cur];
  $('#title').textContent = ex.title;
  $('#tabs').innerHTML = [1,2,3].map(n=>'<button class="'+(n===part?'on':'')+'" data-p="'+n+'">Part '+n+'</button>').join('');
  const T=TIME[part];
  $('#part').innerHTML = '<h3>'+NAME[part]+'</h3>'+R[part](ex.parts[part-1])
    + '<div class="timer"><span class="clock" id="clock">'+fmt(T.prep||T.speak)+'</span><span class="hint" id="phase">'+(T.prep?'1 phút chuẩn bị, ':'')+fmt(T.speak)+' nói</span>'
    + '<button class="primary" id="go">▶ Bắt đầu</button><button id="stop">■ Dừng</button></div>';
  $('#src').innerHTML = 'Nguồn: <a href="https://vstepowl.com/exam-reviews/de-thi/?exam=vlu-exam-'+cur+'&skill=speaking">vstepowl.com</a> · lưu để tự ôn cá nhân';
  document.querySelectorAll('#list a').forEach(a=>a.classList.toggle('active', +a.dataset.id===cur));
  $('#go').onclick=startTimer; $('#stop').onclick=stopTimer;
  try{ localStorage.setItem('vstep-speaking-last', JSON.stringify({cur,part})); }catch(e){}
  if(location.hash!=='#'+cur+'-'+part) history.replaceState(null,'','#'+cur+'-'+part);
}
function go(id,p=1){ cur=id; part=p; show(); $('#side').classList.remove('open'); window.scrollTo(0,0); }

function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const shown = ids.filter(id=>!q || (DATA[id].title+' '+DATA[id].parts.join(' ')).toLowerCase().includes(q));
  $('#list').innerHTML = shown.map(id=>{ const p3=lines(DATA[id].parts[2])[0]||''; return '<a href="#'+id+'-1" data-id="'+id+'">VLU '+id+'<small title="'+esc(p3)+'">'+esc(p3)+'</small></a>'; }).join('') || '<div class="hint">Không có đề nào khớp.</div>';
  document.querySelectorAll('#list a').forEach(a=>{ a.classList.toggle('active', +a.dataset.id===cur); a.onclick=e=>{e.preventDefault(); go(+a.dataset.id);} });
}

$('#count').textContent = ids.length;
$('#q').oninput = renderList;
$('#tabs').onclick = e=>{ const p=e.target.dataset.p; if(p){ part=+p; show(); } };
$('#rand').onclick = ()=> go(ids[Math.floor(Math.random()*ids.length)]);
$('#prev').onclick = ()=>{ const i=ids.indexOf(cur); if(i>0) go(ids[i-1]); };
$('#next').onclick = ()=>{ const i=ids.indexOf(cur); if(i<ids.length-1) go(ids[i+1]); };
$('#menu').onclick = ()=> $('#side').classList.toggle('open');
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight'){part=Math.min(3,part+1);show();} if(e.key==='ArrowLeft'){part=Math.max(1,part-1);show();} });

window.addEventListener('hashchange', ()=>{ const m=location.hash.match(/^#(\d+)-(\d)$/); if(m && DATA[m[1]] && (+m[1]!==cur || +m[2]!==part)){ cur=+m[1]; part=+m[2]; renderList(); show(); } });
const h = location.hash.match(/^#(\d+)-(\d)$/);
if(h && DATA[h[1]]){ cur=+h[1]; part=+h[2]; }
else { try{ const s=JSON.parse(localStorage.getItem('vstep-speaking-last')||'null'); if(s && DATA[s.cur]){ cur=s.cur; part=s.part; } }catch(e){} }
renderList(); show();
</script>
</body>
</html>
